[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmpert"
version = "1.2.0"
description = "非简并与二阶简并 Rayleigh–Schrödinger 微扰论：精确系数、范数归一化、可视化与递推求解"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "mpmath>=1.2",
    "sympy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qmpert = "qmpert.cli:main"

[tool.setuptools]
packages = ["qmpert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
